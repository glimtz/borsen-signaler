name: Veckokörning

on:
  schedule:
    # Måndagar 05:10 UTC ≈ 07:10 svensk sommartid, 06:10 vintertid.
    # Fredagens stängning i USA är klar sedan länge.
    - cron: "10 5 * * 1"
  # Varje push av kod kör jobbet direkt, så en ändring aldrig behöver startas
  # för hand. Botens egna datacommits triggar inget: dels är data/ undantaget,
  # dels startar GitHub aldrig ett flöde från en commit gjord med GITHUB_TOKEN.
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      asof:
        description: "Rekonstruera aldre datum (YYYY-MM-DD, kommaseparerade). Tomt = nulaget."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: veckokorning
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Las av onskade rekonstruktioner
        id: rek
        run: |
          # Datum kan komma antingen fran rekonstruera.txt eller fran
          # Run workflow-faltet. Filen vinner nar bada ar ifyllda.
          FRAN_FIL=""
          if [ -f rekonstruera.txt ]; then
            FRAN_FIL=$(grep -v '^[[:space:]]*#' rekonstruera.txt | tr '\n' ',' \
                       | tr -s ',' | sed 's/^,//; s/,$//' | tr -d '[:space:]')
          fi
          DATUM="${FRAN_FIL:-${{ inputs.asof }}}"
          echo "datum=$DATUM" >> "$GITHUB_OUTPUT"
          if [ -n "$DATUM" ]; then echo "Rekonstruerar: $DATUM"; else echo "Bygger nulaget."; fi

      - name: Bygg underlaget
        run: |
          if [ -n "${{ steps.rek.outputs.datum }}" ]; then
            python build.py --asof "${{ steps.rek.outputs.datum }}"
          else
            python build.py
          fi


      - name: Committa om något ändrats
        run: |
          git config user.name "branschkompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Inget nytt att committa."
          else
            git commit -m "${{ inputs.asof && format('Rekonstruktion {0}', inputs.asof) || 'Veckokörning' }} $(date -u +%Y-%m-%d)"
            # Grenen kan ha flyttat sig sedan checkout (en re-run, eller en
            # push under tiden). Hämta in det och försök igen i stället för
            # att falla på en icke-snabbspolad push.
            for forsok in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                && git push && exit 0
              echo "Push misslyckades (försök $forsok), gör om."
              sleep 5
            done
            echo "Kunde inte pusha efter tre försök."
            exit 1
          fi
