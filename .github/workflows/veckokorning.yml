name: Veckokörning

on:
  schedule:
    # Måndagar 05:10 UTC ≈ 07:10 svensk sommartid, 06:10 vintertid.
    # Fredagens stängning i USA är klar sedan länge.
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veckokorning
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Bygg underlaget
        run: python build.py

      - name: Committa om något ändrats
        run: |
          git config user.name "branschkompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Inget nytt att committa."
          else
            git commit -m "Veckokörning $(date -u +%Y-%m-%d)"
            git push
          fi
